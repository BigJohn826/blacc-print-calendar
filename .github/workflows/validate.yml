name: Validate Portal Data
on:
  push:
    paths:
      - "events.json"
      - "updates.json"
      - "assets/**"
      - "scripts/validate_events.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "events.json"
      - "updates.json"
      - "assets/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_events.py
